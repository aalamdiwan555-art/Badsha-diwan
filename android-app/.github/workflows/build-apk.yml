name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set Android SDK variables
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build F-Droid debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleFDroidDebug

      - name: Read Android version code
        id: version
        shell: bash
        run: |
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' \
            android-app/smartautoclicker/build.gradle.kts | head -n 1)"
          test -n "$version_code"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-fdroid-debug-apk
          path: android-app/smartautoclicker/build/outputs/apk/fDroid/debug/*.apk
          if-no-files-found: error

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install this APK to use the latest Autopilot build.

            versionCode=${{ steps.version.outputs.code }}
          files: android-app/smartautoclicker/build/outputs/apk/fDroid/debug/*.apk