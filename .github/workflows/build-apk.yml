name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build F-Droid Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :smartautoclicker:assembleF_DroidDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find smartautoclicker/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badsha-fdroid-debug-apk
          path: android-app/smartautoclicker/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
